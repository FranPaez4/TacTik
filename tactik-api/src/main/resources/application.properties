spring.application.name=tactik-api
# 1. Conexión a la base de datos tactik_db que creaste antes
spring.datasource.url=jdbc:postgresql://localhost:5432/tactik_db
spring.datasource.username=postgres
spring.datasource.password=Elh0rmiguer031.

# 2. Le decimos a Spring qué motor de base de datos estamos usando
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 3. ¡LA MAGIA! Esto creará y actualizará tus tablas en PostgreSQL automáticamente
spring.jpa.hibernate.ddl-auto=update

# 4. Para ver por la consola de abajo el SQL que ejecuta Spring por debajo (muy útil para aprender)
spring.jpa.show-sql=true